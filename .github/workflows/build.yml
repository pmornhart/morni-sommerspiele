# Morni Sommerspiele bauen und prüfen; bei jedem Push auf main ein Release mit Morni-Sommerspiele.jar, falls es die
# Version (aus pom.xml) noch nicht gibt. Das Netzwerk holt sich von hier immer das neueste Release.
#
# Verfasst mit Claude 🤖
name: Bauen

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Plugin bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Paper 26.x braucht Java 25.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests und Morni-Sommerspiele.jar
        run: mvn -B -q package
      - name: Prüfen, ob es auch mit Paper 26.1 übersetzt
        run: mvn -B -q -Ppaper-26.1 -DskipTests compile
      - name: Netzwerk-Schnittstelle ist nicht in der Jar
        run: |
          if unzip -l target/Morni-Sommerspiele.jar | grep -q 'de/moinmorni/api/'; then
            echo "de.moinmorni.api gehört nicht in die Jar – sie kommt vom Netzwerk-Plugin."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Morni-Sommerspiele
          path: target/Morni-Sommerspiele.jar
          retention-days: 14
      - name: Release für eine neue Version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION gibt es schon – kein neues Release."
            exit 0
          fi
          NOTES="docs/releases/v$VERSION.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "v$VERSION" target/Morni-Sommerspiele.jar \
            --title "Morni Sommerspiele $VERSION" --notes-file "$NOTES" --target "$GITHUB_SHA"
